# Lager en ny release automatisk når du pusher en tag som v1.1.0:
#   git tag v1.1.0 && git push origin v1.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Bygg TurboTast (Apple Silicon + Intel)
        run: VERSION="${GITHUB_REF_NAME}" ./build.sh --release

      - name: Publiser release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/TurboTast.zip \
            --title "TurboTast ${GITHUB_REF_NAME#v}" \
            --generate-notes
