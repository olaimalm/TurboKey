# Publishes a new release automatically when you push a tag like v1.2.0:
#   git tag v1.2.0 && git push origin v1.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build TurboKey (Apple Silicon + Intel)
        run: VERSION="${GITHUB_REF_NAME}" ./build.sh --release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/TurboKey.zip \
            --title "TurboKey ${GITHUB_REF_NAME#v}" \
            --generate-notes
